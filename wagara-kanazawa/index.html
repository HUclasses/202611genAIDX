<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和柄をつまみで作る（金沢の色）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root { --g:#990000; --k:#000; --m:#595757; --l:#efefef; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Noto Sans JP',sans-serif; color:var(--k); background:#fff; }
  header { padding:12px 18px; border-left:12px solid var(--g); margin:16px 16px 8px; }
  header h1 { font-size:22px; font-weight:900; margin:0 0 4px; }
  header p { margin:0; font-size:14px; color:var(--m); line-height:1.6; }
  main { display:flex; flex-wrap:wrap; gap:16px; padding:8px 16px 24px; align-items:flex-start; }
  #stage { flex:1 1 420px; max-width:900px; }
  #stage canvas { width:100% !important; height:auto !important; display:block; border:2px solid #b5b5b6;
    background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%);
    background-size:16px 16px; background-position:0 0,8px 8px; }
  #panel { flex:1 1 280px; max-width:400px; display:flex; flex-direction:column; gap:12px; }
  h2 { font-size:14px; margin:6px 0 0; color:var(--m); }
  .row label { display:flex; justify-content:space-between; font-size:15px; font-weight:700; }
  .row label span { font-weight:400; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; height:30px; accent-color:#990000; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; font-size:14px; font-weight:700; padding:8px 12px; border:2px solid var(--k); background:#fff; cursor:pointer; }
  button.on { background:var(--g); color:#fff; border-color:var(--g); }
  .colors { display:flex; gap:16px; align-items:center; font-size:14px; font-weight:700; flex-wrap:wrap; }
  .colors input[type=color] { width:44px; height:32px; border:2px solid #000; padding:0; vertical-align:middle; }
  .chk { font-size:14px; font-weight:700; display:flex; gap:8px; align-items:center; }
  #save { background:#990000; color:#fff; font-size:16px; padding:12px; }
  #msg { font-size:13px; color:var(--m); min-height:1.2em; margin:0; }
  .note { font-size:13px; color:var(--m); line-height:1.6; margin:0; }
</style>
</head>
<body>
<header>
  <h1>和柄を、つまみで作ろう（金沢の色）</h1>
  <p>柄を選び、大きさや線の太さ、色を調整して、スライドや資料の素材として保存できます。形は数字で決まっているので、同じ設定なら何度でも同じ柄になります。</p>
</header>
<main>
  <div id="stage"></div>
  <div id="panel">
    <h2>柄</h2>
    <div class="btns" id="kinds">
      <button data-k="seigaiha" class="on">青海波</button>
      <button data-k="shippo">七宝</button>
      <button data-k="asanoha">麻の葉</button>
      <button data-k="uroko">鱗</button>
      <button data-k="ichimatsu">市松</button>
    </div>
    <div class="row"><label>大きさ <span id="v-size"></span></label><input id="size" type="range" min="20" max="300" step="1" value="160"></div>
    <div class="row"><label>線の太さ <span id="v-weight"></span></label><input id="weight" type="range" min="0.5" max="14" step="0.5" value="3"></div>
    <div class="row" id="row-rings"><label>波の重ね数 <span id="v-rings"></span></label><input id="rings" type="range" min="1" max="8" step="1" value="4"></div>
    <div class="row"><label>角度 <span id="v-angle"></span></label><input id="angle" type="range" min="0" max="90" step="1" value="0"></div>
    <h2>色</h2>
    <div class="btns" id="presets">
      <button data-a="#f8f5ee" data-b="#990000" class="on">生成りと深紅</button>
      <button data-a="#990000" data-b="#e8bb5e">深紅と金</button>
      <button data-a="#f1e9d5" data-b="#2d5f92">砂色と藍</button>
      <button data-a="#f8f5ee" data-b="#8a6514">生成りと金茶</button>
      <button data-a="#f0e7df" data-b="#775b44">木の色（淡と濃）</button>
      <button data-a="#e2d3c5" data-b="#733529">木の色と赤茶</button>
    </div>
    <p class="note">金沢らしさをイメージした配色です。木の色と赤茶は、金沢市の景観計画の色彩基準をもとにした色です。金沢市の公式な色ではありません。</p>
    <div class="colors">
      <label>地 <input id="c-bg" type="color" value="#f8f5ee"></label>
      <label>柄 <input id="c-fg" type="color" value="#990000"></label>
      <label class="chk"><input id="transparent" type="checkbox">地を透明に</label>
    </div>
    <h2>書き出すサイズ</h2>
    <div class="btns" id="sizes">
      <button data-w="1920" data-h="1080" class="on">スライド 16:9</button>
      <button data-w="1080" data-h="1080">正方形</button>
      <button data-w="1240" data-h="1754">A4縦</button>
      <button data-w="480" data-h="1080">縦長の帯</button>
    </div>
    <button id="save">PNGで保存する</button>
    <p id="msg"></p>
    <p class="note">柄はすべて、円や直線を規則正しく並べて描いています。「大きさ」は柄1つ分の幅（書き出しサイズの画素数）です。</p>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let kind = 'seigaiha', outW = 1920, outH = 1080;
const PREVIEW = 900;

function S() {
  return { size:+$('size').value, weight:+$('weight').value, rings:+$('rings').value, angle:+$('angle').value,
           bg:$('c-bg').value, fg:$('c-fg').value, transparent:$('transparent').checked };
}

// ---- 柄を描く（g：描き先、W,H：その大きさ。数字は書き出しサイズ基準） ----
function drawPattern(g, W, H, s) {
  g.clear();
  if (!s.transparent) g.background(s.bg);
  g.push();
  g.translate(W / 2, H / 2);
  g.rotate(g.radians(s.angle));
  const R = Math.hypot(W, H) / 2 + s.size * 2;     // 回しても隅まで埋まる範囲
  g.strokeWeight(s.weight); g.stroke(s.fg); g.noFill();
  const u = s.size;
  if (kind === 'seigaiha') {
    const r = u / 2, dy = r / 2;
    let row = 0;
    for (let y = -R; y <= R + r; y += dy, row++) {
      const off = (row % 2) * r;
      for (let x = -R - u; x <= R + u; x += u) {
        for (let k = s.rings; k >= 1; k--) {
          const rr = r * k / s.rings;
          if (s.transparent) g.noFill(); else g.fill(s.bg);
          g.arc(x + off, y, rr * 2, rr * 2, g.PI, g.TWO_PI, g.PIE);
          g.noFill();
          g.arc(x + off, y, rr * 2, rr * 2, g.PI, g.TWO_PI, g.OPEN);
        }
      }
    }
  } else if (kind === 'shippo') {
    const r = u / 2;
    for (let i = Math.floor(-R / r) - 1; i <= R / r + 1; i++)
      for (let j = Math.floor(-R / r) - 1; j <= R / r + 1; j++)
        if ((i + j) % 2 === 0) g.circle(i * r, j * r, r * 2);
  } else if (kind === 'asanoha') {
    const a = u, h = a * Math.sqrt(3) / 2;
    for (let j = Math.floor(-R / h) - 1; j <= R / h + 1; j++) {
      for (let i = Math.floor(-R / a) - 2; i <= R / a + 2; i++) {
        const x0 = i * a + (j % 2 ? a / 2 : 0), y0 = j * h;
        const tris = [ [[x0, y0], [x0 + a, y0], [x0 + a / 2, y0 + h]],
                       [[x0 + a, y0], [x0 + a * 1.5, y0 + h], [x0 + a / 2, y0 + h]] ];
        for (const t of tris) {
          const cx = (t[0][0] + t[1][0] + t[2][0]) / 3, cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
          g.triangle(...t[0], ...t[1], ...t[2]);
          for (const p of t) g.line(cx, cy, p[0], p[1]);
        }
      }
    }
  } else if (kind === 'uroko') {
    const a = u, h = a * Math.sqrt(3) / 2;
    g.noStroke(); g.fill(s.fg);
    for (let j = Math.floor(-R / h) - 1; j <= R / h + 1; j++)
      for (let i = Math.floor(-R / a) - 2; i <= R / a + 2; i++) {
        const x0 = i * a + (j % 2 ? a / 2 : 0), y0 = j * h;
        g.triangle(x0, y0 + h, x0 + a / 2, y0, x0 + a, y0 + h);
      }
  } else if (kind === 'ichimatsu') {
    g.noStroke(); g.fill(s.fg);
    for (let i = Math.floor(-R / u) - 1; i <= R / u + 1; i++)
      for (let j = Math.floor(-R / u) - 1; j <= R / u + 1; j++)
        if ((i + j) % 2 === 0) g.rect(i * u, j * u, u, u);
  }
  g.pop();
}

// ---- プレビュー：書き出しサイズを縮小して表示 ----
let pg;
function setup() {
  const c = createCanvas(PREVIEW, PREVIEW * outH / outW);
  c.parent('stage'); pixelDensity(1); noLoop();
  ['size', 'weight', 'rings', 'angle', 'c-bg', 'c-fg', 'transparent'].forEach(id => $(id).addEventListener('input', redraw));
  group('kinds', b => { kind = b.dataset.k; $('row-rings').style.display = kind === 'seigaiha' ? '' : 'none'; });
  group('presets', b => { $('c-bg').value = b.dataset.a; $('c-fg').value = b.dataset.b; });
  group('sizes', b => { outW = +b.dataset.w; outH = +b.dataset.h; resizeCanvas(PREVIEW, Math.round(PREVIEW * outH / outW)); });
  $('save').addEventListener('click', save);
}
function group(id, fn) {
  document.querySelectorAll('#' + id + ' button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#' + id + ' button').forEach(x => x.classList.toggle('on', x === b));
    fn(b); redraw();
  }));
}
function draw() {
  const s = S();
  $('v-size').textContent = s.size + ' px';
  $('v-weight').textContent = s.weight;
  $('v-rings').textContent = s.rings;
  $('v-angle').textContent = s.angle + '°';
  const k = width / outW;                       // 書き出しと同じ見え方に縮小
  if (!pg || pg.width !== outW || pg.height !== outH) pg = createGraphics(outW, outH);
  drawPattern(pg, outW, outH, s);
  clear();
  image(pg, 0, 0, width, height);
}

// ---- 保存：Claudeのページ内では確認つきで保存、手元で開いたときは通常のダウンロード ----
let downloads;
(async () => { try { downloads = window.claude ? await claude.use('downloads') : null; } catch (e) { downloads = null; } })();
const NAMES = { seigaiha:'青海波', shippo:'七宝', asanoha:'麻の葉', uroko:'鱗', ichimatsu:'市松' };
async function save() {
  const s = S();
  const name = `和柄_金沢の色_${NAMES[kind]}_${outW}x${outH}.png`;
  const blob = await new Promise(r => pg.elt.toBlob(r, 'image/png'));
  $('msg').textContent = '';
  if (downloads) {
    try { await downloads.save({ filename: name, data: blob }); $('msg').textContent = '保存しました：' + name; }
    catch (e) { $('msg').textContent = e && e.code === 'declined' ? '保存を取りやめました。' : '保存できませんでした（' + (e && e.code || '不明') + '）。'; }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  $('msg').textContent = '保存しました：' + name;
}
</script>
</body>
</html>
